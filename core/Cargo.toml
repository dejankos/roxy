[package]
name = "core"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
simplelog = "0.12"
log = "0.4"
anyhow = "1"
crossbeam = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
url = "2"
notify = "6.1"
regex = "1"
actix-web =  { version = "4", features = ["openssl"] }
awc = { version = "3", features = ["openssl"] }
openssl = "0.10"

cache = { path = "../cache" }